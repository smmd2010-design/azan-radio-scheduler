<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Azan Radio Scheduler{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1720; --panel: #16212c; --border: #263443; --text: #e6edf3;
      --muted: #8b98a5; --accent: #2f9e6b; --danger: #d9534f; --warn: #d9a441;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 10px;
    }
    header h1 { font-size: 18px; margin: 0; }
    nav a {
      color: var(--muted); text-decoration: none; margin-right: 16px; font-size: 14px;
    }
    nav a.active, nav a:hover { color: var(--text); }
    main { max-width: 900px; margin: 0 auto; padding: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; margin-bottom: 18px;
    }
    .card h2 { margin-top: 0; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 500; }
    input, select {
      background: #0c141b; border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 6px; font-size: 14px; width: 100%;
    }
    label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
    button {
      background: var(--accent); color: white; border: none; padding: 9px 16px;
      border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 10px;
    }
    button.secondary { background: #33424f; }
    button.danger { background: var(--danger); }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .spinner {
      display: inline-block; width: 11px; height: 11px; margin-right: 6px;
      border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; vertical-align: -1px; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .test-status { margin: 8px 0 0; font-size: 13px; min-height: 18px; }
    .test-status.ok { color: var(--accent); }
    .test-status.fail { color: var(--danger); }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.ok { background: rgba(47,158,107,.2); color: var(--accent); }
    .badge.warn { background: rgba(217,164,65,.2); color: var(--warn); }
    .badge.off { background: rgba(139,152,165,.2); color: var(--muted); }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
    .flash.error { background: rgba(217,83,79,.15); color: var(--danger); border: 1px solid var(--danger); }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    code { background: #0c141b; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🕌 Azan Radio Scheduler</h1>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">Dashboard</a>
      <a href="/devices" class="{{ 'active' if request.url.path == '/devices' }}">Devices</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' }}">Settings</a>
      <a href="/logs" class="{{ 'active' if request.url.path == '/logs' }}">Logs</a>
      {% if request.session.get('authed') %}
      <form action="/logout" method="post" style="display:inline">
        <button type="submit" class="secondary" style="margin:0;padding:4px 10px;">Log out</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
